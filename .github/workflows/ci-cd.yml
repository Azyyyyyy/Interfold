name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [ main, develop ]
    # Immutable bootstrapper pins (tag IS the version).
    tags: [ 'v*' ]
  # Manual safety-net for validating arm cross-builds from a PR head branch -
  # dispatch against the branch with `bootstrapper-full-rids` on (default) to
  # run the full RID matrix a PR run otherwise skips.
  workflow_dispatch:
    inputs:
      bootstrapper-full-rids:
        description: 'Build all bootstrapper RIDs (linux-x64/arm/arm64). Off = fast PR-shape build (linux-x64 only).'
        type: boolean
        default: true

env:
  DOCKERFILE_PATH: Dockerfile
  BOOTSTRAPPER_DOCKERFILE_PATH: Dockerfile.bootstrapper
  # Opt every CI leg out of the auto-managed integration-test DB bench
  # (see TestBenchCoordinator). CI direct-launches the MTP test-host DLLs so it
  # would not read the shared runsettings anyway, but asserting `0` at the
  # workflow scope makes the intent explicit and covers any future path that
  # goes through `dotnet test`.
  INTERFOLD_TEST_BENCH: '0'
  # Release-time bootstrapper matrix. `build` downgrades to linux/amd64 alone
  # on PRs (only RID CI tests need - skips QEMU-emulated arm cross-builds for
  # artefacts nothing on the PR critical path consumes); workflow_dispatch
  # inherits the full matrix by default. Adding a platform also needs a
  # matching `buildx_for` entry + upload step in
  # `.github/actions/build-bootstrapper-multi-rid/action.yml` and a
  # TARGETARCH->RID branch in both `/Dockerfile` and `/Dockerfile.bootstrapper`.
  BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  BOOTSTRAPPER_RIDS: linux-x64 linux-arm linux-arm64
  # Runner-side .NET SDK. The bootstrapper Docker build pins its own SDK.
  DOTNET_VERSION: '10.0.x'

jobs:
  # prepare: emit tests/integration/*/ as a JSON array for test-int's matrix,
  # and detect whether bootstrapper-core paths changed (AppHost / ServiceDefaults /
  # Bootstrapper tool + packaging/tests). API-only diffs do not enable the gate —
  # AppHost references Api.Host but the bootstrapper never runs that host.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      bootstrapper: ${{ steps.bootstrapper.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrapper-relevant changes
        id: bootstrapper
        shell: bash
        run: |
          set -euo pipefail
          # Tags cut a release; workflow_dispatch is an explicit full rebuild.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bootstrapper gate: forced on (${{ github.event_name }} / ${{ github.ref_type }})"
            exit 0
          fi

          pattern='^hosts/Interfold\.AppHost/|^hosts/Interfold\.ServiceDefaults/|^tools/Interfold\.Bootstrapper/|^tests/unit/Interfold\.Bootstrapper\.UnitTests/|^tests/integration/Interfold\.Bootstrapper\.IntegrationTests/|^Dockerfile\.bootstrapper$|^\.github/actions/build-bootstrapper-multi-rid/|^\.github/scripts/resolve-bootstrapper-version\.sh$|^\.github/scripts/resolve-bootstrapper-channel\.sh$'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Bootstrapper gate: forced on (new branch / no before SHA)"
              exit 0
            fi
          fi

          echo "Diffing $base...$head for bootstrapper-core paths"
          if git diff --name-only "$base" "$head" | tee /tmp/changed-files.txt | grep -E "$pattern" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bootstrapper gate: ON"
            grep -E "$pattern" /tmp/changed-files.txt || true
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrapper gate: OFF (no AppHost / ServiceDefaults / Bootstrapper changes)"
          fi

      - name: Enumerate integration test projects
        id: set-matrix
        env:
          BOOTSTRAPPER: ${{ steps.bootstrapper.outputs.changed }}
        run: |
          set -euo pipefail
          projects=$(ls -d tests/integration/*/ \
            | sed 's:tests/integration/::;s:/$::' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$BOOTSTRAPPER" != "true" ]; then
            projects=$(jq -c 'map(select(. != "Interfold.Bootstrapper.IntegrationTests"))' <<<"$projects")
          fi
          echo "matrix=$projects" >> "$GITHUB_OUTPUT"
          echo "Discovered integration test projects: $projects"
          echo "bootstrapper=$BOOTSTRAPPER"

  # build: whole-solution compile + bootstrapper buildx (matrix size gated by
  # `FULL_BOOTSTRAPPER_BUILD` below). Uploads per-RID `interfold-bootstrap-<rid>`
  # tar.gz artefacts + a `dotnet-build-<sha>` artefact carrying the test-project
  # bins for downstream direct-DLL launch.
  build:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      # Push always builds the full matrix; workflow_dispatch respects the input
      # (default on). Everything else (pull_request) is a fast build.
      FULL_BOOTSTRAPPER_BUILD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bootstrapper-full-rids) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history + tags so rolling stamps can use `git describe` for the last v* tag.
          fetch-depth: 0

      # Cache-key = csproj + global.json hashes (no packages.lock.json here);
      # any csproj edit busts it, still cheaper than a cold restore.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      # docker-container driver required for multi-arch manifest output.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore
        run: dotnet restore Interfold.slnx

      - name: Build (Release)
        run: dotnet build Interfold.slnx --configuration Release --no-restore

      # Tag pins stamp InformationalVersion without the leading `v` so
      # System.Version / pin compare treat `v0.0.1` and `0.0.1` as the same.
      # Rolling builds use `{last v* tag}+{short commit id}` (see resolve script).
      # Channel (stable / bleeding-edge / pin) is stamped as AssemblyMetadata.
      - name: Resolve bootstrapper version stamp
        if: needs.prepare.outputs.bootstrapper == 'true'
        id: boot_ver
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/resolve-bootstrapper-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve bootstrapper release channel
        if: needs.prepare.outputs.bootstrapper == 'true'
        id: boot_channel
        shell: bash
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          channel="$(bash .github/scripts/resolve-bootstrapper-channel.sh)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Build & upload multi-RID bootstrapper artefacts
        if: needs.prepare.outputs.bootstrapper == 'true'
        uses: ./.github/actions/build-bootstrapper-multi-rid
        with:
          platforms: ${{ env.FULL_BOOTSTRAPPER_BUILD == 'true' && env.BUILD_PLATFORMS || 'linux/amd64' }}
          rids: ${{ env.FULL_BOOTSTRAPPER_BUILD == 'true' && env.BOOTSTRAPPER_RIDS || 'linux-x64' }}
          dockerfile: ${{ env.BOOTSTRAPPER_DOCKERFILE_PATH }}
          artifact-suffix: ${{ github.sha }}
          bootstrapper-version: ${{ steps.boot_ver.outputs.version }}
          bootstrapper-channel: ${{ steps.boot_channel.outputs.channel }}

      # tar.gz preserves +x that upload-artifact@v4's zip strips. Ships test-
      # project bins (direct-DLL launch) and `tools/*/bin` because
      # `Interfold.Bootstrapper.UnitTests` locates the managed DLL and the
      # multi-RID-composite-staged linux-x64 ELF by absolute path, not projref.
      - name: Package build output
        shell: bash
        run: |
          tar -czf dotnet-build.tar.gz \
            tests/integration/*/bin \
            tests/unit/*/bin \
            tools/*/bin

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-${{ github.sha }}
          path: dotnet-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  # test-unit: single job, loops over every `tests/unit/*/` project. Includes
  # `BinarySizeGuardrailTests`, which reads the staged linux-x64 binary from the
  # build artefact - see `BinarySizeGuardrailTests.LocatePublishedBinary`.
  test-unit:
    runs-on: ubuntu-latest
    needs: [ prepare, build ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test runner
        uses: ./.github/actions/setup-test-runner
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          build-artifact-name: dotnet-build-${{ github.sha }}

      # Directly launch each test project's MTP host DLL instead of going through
      # `dotnet test <csproj> --no-build --no-restore` - the new .NET 10 `dotnet
      # test` command regressed test-project discovery on our tarball-extracted
      # trees between 10.0.301 and 10.0.302 ("No test projects were found."), and
      # TUnit test hosts are self-contained MTP executables that accept the same
      # `--coverage` / `--coverage-output-format` flags directly.
      - name: Test (unit)
        env:
          BOOTSTRAPPER: ${{ needs.prepare.outputs.bootstrapper }}
        run: |
          set -euo pipefail
          for dir in tests/unit/*/; do
            name=$(basename "$dir")
            if [ "$name" = "Interfold.Bootstrapper.UnitTests" ] && [ "$BOOTSTRAPPER" != "true" ]; then
              echo "Skipping $name (no bootstrapper-core path changes)"
              continue
            fi
            echo "::group::$name"
            dotnet "$dir"bin/Release/net10.0/"$name".dll \
              --coverage --coverage-output-format cobertura
            echo "::endgroup::"
          done

      - name: Upload coverage (unit)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ github.sha }}
          path: '**/TestResults/**/*.cobertura.xml'
          retention-days: 1
          if-no-files-found: error

      # TUnit's cooperative mode (default on GHA) merges every DLL launched
      # inside the `Test (unit)` loop into one HTML report under
      # `$RUNNER_TEMP/tunit-aggregate/<scope>/merged-report.html`. Uploaded here
      # so the merged report is downloadable alongside the coverage bundle.
      - name: Upload merged TUnit report (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-merged-unit-${{ github.sha }}
          path: ${{ runner.temp }}/tunit-aggregate/**/merged-report.html
          retention-days: 7
          if-no-files-found: warn

  # test-int: one matrix leg per project under tests/integration/. In-DinD
  # concurrency inside the Bootstrapper leg auto-sizes off NCPU / MemTotal /
  # DockerRootDir - see
  # `tests/integration/Interfold.Bootstrapper.IntegrationTests/fixtures/DinDParallelLimit.cs`.
  test-int:
    runs-on: ubuntu-latest
    needs: [ prepare, build ]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: test-int (${{ matrix.project }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test runner
        uses: ./.github/actions/setup-test-runner
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          build-artifact-name: dotnet-build-${{ github.sha }}

      # Direct MTP-host launch (same reasoning as `test-unit`). `defer` tells
      # TUnit's aggregation reporter to persist its per-suite JSON sidecar
      # (`{asm}-{os}-{tfm}.tunit-report.json`) alongside the HTML report but
      # skip writing its markdown block to $GITHUB_STEP_SUMMARY. `test-int-
      # summary` downloads every leg's sidecar and calls `tunit-report merge`
      # on them, splicing one native TUnit summary into that job's summary tab
      # instead of one block per matrix leg. See TUnit PR #6415.
      #
      # Two legs carry [Explicit] tests and need bespoke invocations:
      #   - Bootstrapper.IntegrationTests: every test class is [Explicit] (see the
      #     assembly's AssemblyInfo.cs); a `/*/*/*/*` treenode filter matches all
      #     tests, all explicit, so TUnit runs the full suite. Default (unfiltered)
      #     invocation would skip everything. Native Windows tests ([RequiresWindows])
      #     skip here; `test-int-bootstrapper-windows` runs them.
      #   - Infrastructure.IntegrationTests: MultiNodeScyllaTests alone is [Explicit]
      #     (7-DC ring, GB-scale RAM). Runs in two passes because TUnit's rule is
      #     "explicit only runs when every filtered test is explicit" — a single
      #     mixed filter would exclude MultiNode. The first pass produces the
      #     canonical sidecar; the second is renamed on-the-fly so both survive
      #     upload. `test-int-summary` merges them like any other leg's sidecars.
      - name: Test (integration - ${{ matrix.project }})
        env:
          TUNIT_AGGREGATE_REPORTS: defer
        run: |
          set -euo pipefail
          dll="tests/integration/${{ matrix.project }}/bin/Release/net10.0/${{ matrix.project }}.dll"
          case "${{ matrix.project }}" in
            Interfold.Bootstrapper.IntegrationTests)
              dotnet "$dll" \
                --treenode-filter '/*/*/*/*' \
                --coverage --coverage-output-format cobertura
              ;;
            Interfold.Infrastructure.IntegrationTests)
              dotnet "$dll" \
                --coverage --coverage-output-format cobertura
              # Preserve the non-explicit sidecar before the second invocation
              # overwrites it. Both files are picked up by the `**/*.tunit-report.json`
              # upload glob below.
              results="tests/integration/${{ matrix.project }}/bin/Release/net10.0/TestResults"
              for sidecar in "$results"/*.tunit-report.json; do
                [ -e "$sidecar" ] || continue
                mv "$sidecar" "${sidecar%.tunit-report.json}-nonexplicit.tunit-report.json"
              done
              dotnet "$dll" \
                --treenode-filter '/*/*/*MultiNodeScyllaTests/*' \
                --coverage --coverage-output-format cobertura
              ;;
            *)
              dotnet "$dll" \
                --coverage --coverage-output-format cobertura
              ;;
          esac

      # Sidecars land in `TestResults/{asm}-{os}-{tfm}.tunit-report.json` next to
      # the HTML report the engine also emits by default; `**/*.tunit-report.json`
      # picks them up wherever the test host's cwd ended up.
      - name: Upload TUnit report sidecar (${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-sidecar-${{ matrix.project }}-${{ github.sha }}
          path: 'tests/integration/${{ matrix.project }}/**/*.tunit-report.json'
          retention-days: 1
          if-no-files-found: warn

      - name: Upload coverage (integration - ${{ matrix.project }})
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int-${{ matrix.project }}-${{ github.sha }}
          path: 'tests/integration/${{ matrix.project }}/**/TestResults/**/*.cobertura.xml'
          retention-days: 1
          if-no-files-found: error

  # Native Windows: multi-RID publish (win-x64 / win-arm64) + zip
  # artefacts, size guard, Task Scheduler install-service tests, and a thin
  # publish smoke. (No win-arm — .NET has no Windows 32-bit ARM RID; linux-arm
  # has no peer.) DinD/systemd stays on the ubuntu Bootstrapper matrix leg.
  test-int-bootstrapper-windows:
    runs-on: windows-latest
    needs: [ prepare, build ]
    if: needs.prepare.outputs.bootstrapper == 'true'
    name: test-int (Bootstrapper Windows multi-RID)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup test runner
        uses: ./.github/actions/setup-test-runner
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          build-artifact-name: dotnet-build-${{ github.sha }}

      - name: Resolve bootstrapper version stamp
        id: boot_ver
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/resolve-bootstrapper-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve bootstrapper release channel
        id: boot_channel
        shell: bash
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          channel="$(bash .github/scripts/resolve-bootstrapper-channel.sh)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Publish Windows bootstrapper RIDs (zip + size guard)
        shell: pwsh
        env:
          BOOTSTRAPPER_VERSION: ${{ steps.boot_ver.outputs.version }}
          BOOTSTRAPPER_CHANNEL: ${{ steps.boot_channel.outputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rids = @('win-x64', 'win-arm64')
          $base = Join-Path $env:RUNNER_TEMP 'interfold-bootstrap-win'
          $maxBytes = 75L * 1024 * 1024
          $version = $env:BOOTSTRAPPER_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'BOOTSTRAPPER_VERSION was empty' }
          $channel = $env:BOOTSTRAPPER_CHANNEL
          New-Item -ItemType Directory -Force -Path $base | Out-Null

          foreach ($rid in $rids) {
            $out = Join-Path $base $rid
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Write-Host "Publishing $rid -> $out (InformationalVersion=$version; channel=$channel)"
            dotnet publish tools/Interfold.Bootstrapper/Interfold.Bootstrapper.csproj `
              /p:PublishProfile=$rid `
              /p:Version=$version `
              /p:InformationalVersion=$version `
              /p:BootstrapperReleaseChannel=$channel `
              -o $out
            $exe = Join-Path $out 'interfold-bootstrap.exe'
            if (-not (Test-Path $exe)) {
              throw "$rid publish missing interfold-bootstrap.exe under $out"
            }
            $len = (Get-Item -LiteralPath $exe).Length
            Write-Host ("{0} size: {1:N1} MiB" -f $rid, ($len / 1MB))
            if ($len -ge $maxBytes) {
              throw ("{0} PE is {1:N1} MiB (limit {2:N0} MiB)" -f $rid, ($len / 1MB), ($maxBytes / 1MB))
            }
            $zip = Join-Path $env:RUNNER_TEMP "interfold-bootstrap-$rid.zip"
            if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
            Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -Force
          }

          # Stage win-x64 for native tests + INTERFOLD_BOOTSTRAPPER_WIN_PUBLISH_DIR.
          $stage = 'tools/Interfold.Bootstrapper/bin/Release/net10.0/win-x64/publish'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $base 'win-x64\*') -Destination $stage -Force
          $winX64Out = Join-Path $base 'win-x64'
          "INTERFOLD_BOOTSTRAPPER_WIN_PUBLISH_DIR=$winX64Out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload bootstrapper artifact (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: interfold-bootstrap-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/interfold-bootstrap-win-x64.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload bootstrapper artifact (win-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: interfold-bootstrap-win-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/interfold-bootstrap-win-arm64.zip
          retention-days: 7
          if-no-files-found: error

      - name: Test (Windows install-service + publish smoke)
        shell: pwsh
        env:
          TUNIT_AGGREGATE_REPORTS: defer
        run: |
          $dll = "tests/integration/Interfold.Bootstrapper.IntegrationTests/bin/Release/net10.0/Interfold.Bootstrapper.IntegrationTests.dll"
          dotnet $dll `
            --treenode-filter '/*/*/*Windows*/*' `
            --coverage --coverage-output-format cobertura

      - name: Upload TUnit report sidecar (Bootstrapper Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-sidecar-Interfold.Bootstrapper.IntegrationTests-windows-${{ github.sha }}
          path: 'tests/integration/Interfold.Bootstrapper.IntegrationTests/**/*.tunit-report.json'
          retention-days: 1
          if-no-files-found: warn

      - name: Upload coverage (Bootstrapper Windows)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int-Interfold.Bootstrapper.IntegrationTests-windows-${{ github.sha }}
          path: 'tests/integration/Interfold.Bootstrapper.IntegrationTests/**/TestResults/**/*.cobertura.xml'
          retention-days: 1
          if-no-files-found: error

  # test-int-summary: renders one native TUnit aggregated block from every
  # matrix leg's sidecar. `tunit-report merge --github-summary` splices the
  # block into $GITHUB_STEP_SUMMARY between HTML-comment markers so foreign
  # summary content is untouched; separate job so its Summary-tab section
  # renders top-level, not nested under `coverage`.
  test-int-summary:
    runs-on: ubuntu-latest
    needs: [ test-int, test-int-bootstrapper-windows ]
    if: always()
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download TUnit sidecars
        uses: actions/download-artifact@v4
        with:
          path: tunit-sidecars
          pattern: tunit-sidecar-*
          merge-multiple: true

      # Version-pinned to the same 1.61 line as the TUnit engine that produced
      # the sidecars - the tool links the engine's serializer/merger/renderer
      # sources directly, so drift here would silently miss fields. `--tool-path`
      # instead of `--global` because setup-dotnet does not add
      # `$HOME/.dotnet/tools` to `$GITHUB_PATH`, so a global install would leave
      # the binary un-findable in the next step.
      - name: Install tunit-report tool
        run: dotnet tool install --tool-path .tunit-tools TUnit.Reporting.Tool --version '1.61.*'

      # `--output` overrides the default `<dir>/merged-report.html` so the file
      # lands outside the sidecar tree and the upload step's `path:` stays a
      # single glob-free string.
      - name: Merge and write summary
        run: |
          ./.tunit-tools/tunit-report merge \
            --directory tunit-sidecars \
            --output merged-report.html \
            --github-summary

      - name: Upload merged TUnit report (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-merged-int-${{ github.sha }}
          path: merged-report.html
          retention-days: 7
          if-no-files-found: warn

  # coverage: three ReportGenerator outputs - unit-only, integration-only,
  # combined - so integration-only coverage (candidates for adding unit tests)
  # is visible at a glance.
  coverage:
    runs-on: ubuntu-latest
    needs: [ test-unit, test-int, test-int-bootstrapper-windows ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `merge-multiple: false` keeps each artefact under its own `coverage-*/`
      # subfolder so the three ReportGenerator globs below can address them
      # independently.
      - name: Download all coverage artefacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-inputs
          pattern: coverage-*
          merge-multiple: false

      # Distinct `sticky-header:` per invocation so sticky-pull-request-comment
      # keeps the three summaries side-by-side instead of overwriting one slot.
      - name: Publish unit coverage
        uses: ./.github/actions/publish-coverage-report
        with:
          reports-glob: 'coverage-inputs/coverage-unit-*/**/*.cobertura.xml'
          targetdir: coveragereport/unit
          title: 'Unit tests'
          sticky-header: coverage-unit

      - name: Publish integration coverage
        uses: ./.github/actions/publish-coverage-report
        with:
          reports-glob: 'coverage-inputs/coverage-int-*/**/*.cobertura.xml'
          targetdir: coveragereport/integration
          title: 'Integration tests'
          sticky-header: coverage-integration

      - name: Publish combined coverage
        uses: ./.github/actions/publish-coverage-report
        with:
          reports-glob: 'coverage-inputs/coverage-*/**/*.cobertura.xml'
          targetdir: coveragereport/all
          title: 'All tests'
          sticky-header: coverage-all

      - name: Write coverage summary
        run: |
          {
            cat coveragereport/unit/SummaryGithub.md
            echo
            cat coveragereport/integration/SummaryGithub.md
            echo
            cat coveragereport/all/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"

  # publish: multi-arch API image push, gated to pushes on `main` (tag `latest`)
  # or `develop` (tag `bleeding-edge`). Shares GHA cache scope `interfold-dotnet`
  # with the bootstrapper buildx in `build`.
  publish:
    runs-on: ubuntu-latest
    needs: [ test-unit, test-int, test-int-bootstrapper-windows ]
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is gated to the default branch (currently `main`); `bleeding-edge`
      # is gated to `develop`. The other two tags (branch name, `sha-<commit>`)
      # follow docker/metadata-action defaults.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/interfold-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=bleeding-edge,enable=${{ github.ref == 'refs/heads/develop' }}

      # provenance/sbom off so the manifest list doesn't carry BuildKit's
      # `unknown/unknown` attestation entries (breaks some consumers and the
      # bootstrapper's manifest inspection).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=interfold-dotnet
          cache-to: type=gha,mode=max,scope=interfold-dotnet

  # publish-bootstrapper: GitHub Releases tarballs + ghcr.io image for the bootstrapper CLI.
  # Rolling unique tags on main/develop; immutable v* pins on tag push. Skipped when
  # prepare's bootstrapper gate is off (no AppHost / ServiceDefaults / Bootstrapper diffs).
  publish-bootstrapper:
    runs-on: ubuntu-latest
    needs: [ prepare, test-unit, test-int, test-int-bootstrapper-windows, build ]
    if: >-
      always() &&
      needs.prepare.outputs.bootstrapper == 'true' &&
      needs.build.result == 'success' &&
      needs.test-unit.result == 'success' &&
      needs.test-int.result == 'success' &&
      needs.test-int-bootstrapper-windows.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bootstrapper tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: interfold-bootstrap-linux-*-${{ github.sha }}
          merge-multiple: true
          path: bootstrap-release

      - name: Download bootstrapper Windows zips
        uses: actions/download-artifact@v4
        with:
          pattern: interfold-bootstrap-win-*-${{ github.sha }}
          merge-multiple: true
          path: bootstrap-release

      - name: Resolve bootstrapper image version stamp
        id: boot_ver
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/resolve-bootstrapper-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve bootstrapper release channel
        id: boot_channel
        shell: bash
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          channel="$(bash .github/scripts/resolve-bootstrapper-channel.sh)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Resolve rolling release identity
        if: github.ref_type != 'tag'
        id: rolling
        shell: bash
        run: |
          set -euo pipefail
          # Unique tag per run: immutable releases lock tags after publish, so fixed
          # rolling names cannot be reused. The InformationalVersion stamp is part of
          # the tag (stable-{version} / bleeding-edge-{version}); clients strip the
          # prefix for update comparison and verify assets via the Releases API
          # `digest` field — no version.txt / SHA256SUMS assets.
          version='${{ steps.boot_ver.outputs.version }}'
          if [ -z "$version" ]; then
            echo "boot_ver.outputs.version was empty" >&2
            exit 1
          fi
          if [ '${{ github.ref }}' = 'refs/heads/develop' ]; then
            echo "tag=bleeding-edge-${version}" >> "$GITHUB_OUTPUT"
            echo "prefix=bleeding-edge-" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=stable-${version}" >> "$GITHUB_OUTPUT"
            echo "prefix=stable-" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Draft first so assets attach before immutability locks the release (required for
      # prereleases on immutable-release repos; safe for full releases too).
      - name: Publish rolling GitHub Release (draft)
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rolling.outputs.tag }}
          name: ${{ steps.rolling.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.rolling.outputs.prerelease == 'true' }}
          make_latest: false
          files: |
            bootstrap-release/interfold-bootstrap-linux-x64.tar.gz
            bootstrap-release/interfold-bootstrap-linux-arm.tar.gz
            bootstrap-release/interfold-bootstrap-linux-arm64.tar.gz
            bootstrap-release/interfold-bootstrap-win-x64.zip
            bootstrap-release/interfold-bootstrap-win-arm64.zip

      - name: Finalize rolling GitHub Release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.rolling.outputs.tag }}'
          if [ '${{ steps.rolling.outputs.prerelease }}' = 'true' ]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --latest
          fi

      - name: Prune older rolling releases
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prefix='${{ steps.rolling.outputs.prefix }}'
          keep=5
          mapfile -t stale < <(gh release list --limit 50 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"${prefix}\"))] | sort_by(.createdAt) | reverse | .[${keep}:] | .[].tagName")
          for tag in "${stale[@]+"${stale[@]}"}"; do
            [[ -n "$tag" ]] || continue
            echo "Deleting stale rolling release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      # Pin tag is the version identity (v* → InformationalVersion without leading v).
      # Draft-then-publish so assets land before immutability locks the release.
      - name: Publish pinned GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          files: |
            bootstrap-release/interfold-bootstrap-linux-x64.tar.gz
            bootstrap-release/interfold-bootstrap-linux-arm.tar.gz
            bootstrap-release/interfold-bootstrap-linux-arm64.tar.gz
            bootstrap-release/interfold-bootstrap-win-x64.zip
            bootstrap-release/interfold-bootstrap-win-arm64.zip

      - name: Finalize pinned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit '${{ github.ref_name }}' --draft=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (bootstrapper image)
        id: bootstrapper_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/interfold-bootstrap
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=bleeding-edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}

      - name: Build and push bootstrapper container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.BOOTSTRAPPER_DOCKERFILE_PATH }}
          target: runtime
          push: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          provenance: false
          sbom: false
          tags: ${{ steps.bootstrapper_meta.outputs.tags }}
          labels: ${{ steps.bootstrapper_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.boot_ver.outputs.version }}
            CHANNEL=${{ steps.boot_channel.outputs.channel }}
          cache-from: type=gha,scope=interfold-dotnet
          cache-to: type=gha,mode=max,scope=interfold-dotnet
