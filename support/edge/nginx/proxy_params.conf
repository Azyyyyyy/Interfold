# Shared reverse-proxy headers for API upstream (HTTP + WebSocket).
# Included from edge server blocks; keep in sync with path/subdomain templates.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $scheme is http on the compose network; Cloudflare already stamped https.
proxy_set_header X-Forwarded-Proto $interfold_forwarded_proto;
proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
